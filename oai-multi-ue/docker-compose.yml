services:
  ue1:
    image: oai-ue-test
    container_name: oai-ue1
    hostname: oai-ue1
    privileged: true
    volumes:
    - ./ue1.conf:/opt/oai/ue.conf:ro
    - ./uecap_ports2.xml:/opt/oai/uecap_ports2.xml:ro
    networks:
      ue_net:
        ipv4_address: 172.30.0.11
    command:
    - /opt/oai/nr-uesoftmodem
    - --rfsim
    - -r
    - '106'
    - --numerology
    - '1'
    - --band
    - '78'
    - -C
    - '3619200000'
    - --ssb
    - '516'
    - --rfsimulator.serveraddr
    - 192.168.1.85
    - --ue-nb-ant-tx
    - '2'
    - --ue-nb-ant-rx
    - '2'
    - -O
    - /opt/oai/ue.conf
    - --uecap_file 
    - /opt/oai/uecap_ports2.xml
